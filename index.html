<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartshirt Fitness Tracker</title>

    <!-- Chart.js für Live-Diagramme -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2canvas für den Foto/Bericht-Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .status-bar {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #connectBtn {
            background-color: #0284c7;
            color: white;
        }

        #stopBtn {
            background-color: #ef4444;
            color: white;
        }

        /* METRIK-KACHELN GRID */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .metric-card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: center;
        }

        .metric-label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .unit {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: normal;
        }

        /* GRAPHEN CARDS */
        .chart-card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 15px;
        }

        .chart-title {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* MODAL (POPUP FOR WORKOUT PHOTO) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 16px;
            max-width: 450px;
            width: 100%;
            color: white;
            border: 1px solid #334155;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 15px 0;
            text-align: left;
        }

        .summary-item {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }

        .summary-item strong {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .summary-item span {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
        }

        #imagePreviewContainer img {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #475569;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-save {
            background-color: #10b981;
            color: white;
        }

        .btn-close {
            background-color: #64748b;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Smartshirt Tracker</h1>
        <div class="status-bar" id="statusText">Status: Nicht verbunden</div>
    </header>

    <!-- Steuerung -->
    <div class="controls">
        <button id="connectBtn" onclick="connectBLE()">👕 Verbinden</button>
        <button id="stopBtn" onclick="stopWorkout()" disabled>🛑 Beenden</button>
    </div>

    <!-- Live-Kacheln -->
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">❤️ Puls</div>
            <div class="metric-value" style="color: #4ade80;" id="pulseVal">--</div>
            <div class="unit">BPM</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">🫁 Atmung</div>
            <div class="metric-value" style="color: #38bdf8;" id="breathVal">--</div>
            <div class="unit">RPM</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">⚡ Speed</div>
            <div class="metric-value" style="color: #fbbf24;" id="speedVal">0</div>
            <div class="unit">km/h</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">🔥 Kalorien</div>
            <div class="metric-value" style="color: #f87171;" id="calVal">0</div>
            <div class="unit">kcal</div>
        </div>
    </div>

    <!-- Puls Graph -->
    <div class="chart-card">
        <div class="chart-title">❤️ PULS-VERLAUF (BPM)</div>
        <canvas id="pulseChart"></canvas>
    </div>

    <!-- Atmung Graph -->
    <div class="chart-card">
        <div class="chart-title">🫁 ATEMFREQUENZ-VERLAUF (RPM)</div>
        <canvas id="breathChart"></canvas>
    </div>

    <!-- MODAL / ZUSAMMENFASSUNG PER FOTO -->
    <div class="modal-overlay" id="summaryModal">
        <div class="modal-content" id="pdf-layout">
            <h2 style="text-align: center; color: #38bdf8;">🏆 Workout Report</h2>
            <p style="text-align: center; font-size: 0.8rem; color: #94a3b8; margin-top: 4px;" id="reportDate"></p>

            <div class="summary-grid">
                <div class="summary-item">
                    <strong>Ø PULS</strong>
                    <span id="sumPulse">--</span> <small class="unit">BPM</small>
                </div>
                <div class="summary-item">
                    <strong>Ø ATMUNG</strong>
                    <span id="sumBreath">--</span> <small class="unit">RPM</small>
                </div>
                <div class="summary-item">
                    <strong>MAX SPEED</strong>
                    <span id="sumSpeed">0</span> <small class="unit">km/h</small>
                </div>
                <div class="summary-item">
                    <strong>KALORIEN</strong>
                    <span id="sumCal">0</span> <small class="unit">kcal</small>
                </div>
            </div>

            <!-- Bild-Vorschau aus html2canvas -->
            <div id="imagePreviewContainer"></div>

            <div class="modal-buttons">
                <button class="btn-save" onclick="downloadReportImage()">📸 Foto Speichern</button>
                <button class="btn-close" onclick="closeModal()">Schließen</button>
            </div>
        </div>
    </div>

    <script>
        // --- BLE UUIDs ---
        const SERVICE_UUID = "0000180d-0000-1000-8000-00805f9b34fb";
        const CHARACTERISTIC_UUID = "00002a37-0000-1000-8000-00805f9b34fb";

        let bleDevice = null;
        let gattServer = null;
        let generatedCanvas = null;

        // Statistik-Speicher für die Auswertung
        let pulseSum = 0, pulseCount = 0;
        let breathSum = 0, breathCount = 0;
        let maxSpeed = 0;
        let totalCalories = 0;

        // --- CHART.JS INITIALISIERUNG ---
        const maxDataPoints = 30;

        // 1. Puls Chart
        const ctxPulse = document.getElementById('pulseChart').getContext('2d');
        const pulseChart = new Chart(ctxPulse, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Puls', data: [], borderColor: '#4ade80', backgroundColor: 'rgba(74, 222, 128, 0.1)', borderWidth: 2, tension: 0.3, fill: true }] },
            options: {
                responsive: true,
                animation: false,
                scales: {
                    y: { suggestedMin: 50, suggestedMax: 180, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });

        // 2. Atmung Chart
        const ctxBreath = document.getElementById('breathChart').getContext('2d');
        const breathChart = new Chart(ctxBreath, {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Atmung', data: [], borderColor: '#38bdf8', backgroundColor: 'rgba(56, 189, 248, 0.1)', borderWidth: 2, tension: 0.3, fill: true }] },
            options: {
                responsive: true,
                animation: false,
                scales: {
                    y: { suggestedMin: 0, suggestedMax: 35, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });

        // --- BLE VERBINDUNG ---
        async function connectBLE() {
            try {
                document.getElementById('statusText').innerText = "Status: Suche Smartshirt...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                document.getElementById('statusText').innerText = "Status: Verbinde GATT...";
                gattServer = await bleDevice.gatt.connect();

                const service = await gattServer.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleBleData);

                document.getElementById('statusText').innerText = "Status: ✅ Live verbunden";
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;

            } catch (error) {
                console.error("BLE Fehler:", error);
                document.getElementById('statusText').innerText = "Status: Verbindung fehlgeschlagen";
            }
        }

        // --- BLE DATEN EMPFANGEN & VERARBEITEN ---
        function handleBleData(event) {
            const value = event.target.value;
            if (value.byteLength < 5) return;

            const header = value.getUint8(0);
            if (header !== 0x11) return; // Paket-Typ Prüfen

            const pulse = value.getUint8(1);
            const speed = value.getUint8(2);
            const dist = value.getUint8(3);
            const breath = value.getUint8(4);

            const timestamp = new Date().toLocaleTimeString();

            // 1. Puls verarbeiten
            if (pulse > 0) {
                document.getElementById('pulseVal').innerText = pulse;
                pulseSum += pulse;
                pulseCount++;
                addChartData(pulseChart, timestamp, pulse);

                // Kalorien-Ticker (Annäherung basierend auf Herzfrequenz)
                totalCalories += (pulse * 0.0012);
                document.getElementById('calVal').innerText = Math.round(totalCalories);
            } else {
                document.getElementById('pulseVal').innerText = '--';
            }

            // 2. Atmung verarbeiten
            document.getElementById('breathVal').innerText = breath;
            if (breath > 0) {
                breathSum += breath;
                breathCount++;
            }
            addChartData(breathChart, timestamp, breath);

            // 3. Speed & Distanz verarbeiten
            document.getElementById('speedVal').innerText = speed;
            if (speed > maxSpeed) maxSpeed = speed;
        }

        function addChartData(chart, label, data) {
            chart.data.labels.push(label);
            chart.data.datasets[0].data.push(data);

            if (chart.data.labels.length > maxDataPoints) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update();
        }

        // --- WORKOUT STOPPEN & FOTO ERZEUGEN ---
        async function stopWorkout() {
            // BLE Trennen
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }

            document.getElementById('statusText').innerText = "Status: Workout Beendet";
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;

            // Durchschnittswerte berechnen
            const avgPulse = pulseCount > 0 ? Math.round(pulseSum / pulseCount) : '--';
            const avgBreath = breathCount > 0 ? Math.round(breathSum / breathCount) : '--';

            document.getElementById('sumPulse').innerText = avgPulse;
            document.getElementById('sumBreath').innerText = avgBreath;
            document.getElementById('sumSpeed').innerText = maxSpeed;
            document.getElementById('sumCal').innerText = Math.round(totalCalories);
            document.getElementById('reportDate').innerText = new Date().toLocaleString('de-DE');

            // Modal Einblenden
            const modal = document.getElementById('summaryModal');
            modal.style.display = 'flex';

            // Foto-Generierung via html2canvas
            const target = document.getElementById('pdf-layout');
            if (typeof html2canvas !== 'undefined') {
                try {
                    generatedCanvas = await html2canvas(target, {
                        backgroundColor: '#1e293b',
                        scale: 2
                    });

                    const previewContainer = document.getElementById('imagePreviewContainer');
                    previewContainer.innerHTML = '';
                    const img = document.createElement('img');
                    img.src = generatedCanvas.toDataURL('image/png');
                    previewContainer.appendChild(img);
                } catch (err) {
                    console.error("Fehler beim Erstellen der Foto-Zusammenfassung:", err);
                }
            }
        }

        // FOTO DOWNLOAD
        function downloadReportImage() {
            if (!generatedCanvas) return;
            const link = document.createElement('a');
            link.download = `Smartshirt_Workout_${new Date().toISOString().slice(0,10)}.png`;
            link.href = generatedCanvas.toDataURL('image/png');
            link.click();
        }

        // MODAL SCHLIESSEN
        function closeModal() {
            document.getElementById('summaryModal').style.display = 'none';
        }
    </script>
</body>
</html>
